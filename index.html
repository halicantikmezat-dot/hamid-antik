<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Hâmid Antik - Canlı Mezat</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; margin: 0; padding: 15px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; border: 1px solid #334155; }
        h1 { color: #f59e0b; font-size: 22px; margin-bottom: 5px; }
        .kutu { background: #0f172a; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #334155; text-align: left; }
        .fiyat { font-size: 24px; color: #10b981; font-weight: bold; }
        .sayac { font-size: 28px; color: #f59e0b; font-weight: bold; text-align: center; }
        input { width: 100%; padding: 10px; margin: 5px 0 10px 0; box-sizing: border-box; background: #1e293b; border: 1px solid #475569; color: #fff; border-radius: 4px; }
        button { background: #10b981; color: white; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #059669; }
        .foto-galeri { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; }
        .foto-galeri img { width: 100px; height: 100px; object-fit: cover; border-radius: 4px; border: 1px solid #475569; }
    </style>
</head>
<body>

<!-- Antika Tık-Tak Saat Sesi -->
<audio id="alarmSesi" src="https://assets.mixkit.co/active_storage/sfx/2857/2857-preview.mp3" preload="auto"></audio>

<div class="container">
    <h1>🏛️ HÂMİD ANTİK CANLI MEZAT</h1>
    <p style="color:#94a3b8; font-size:13px; margin-top:0;">Balat'tan Canlı Antika ve Obje Müzayedesi</p>

    <div class="kutu">
        <h3 id="mus_urun_ad" style="color:#38bdf8; margin-top:0;">Sahnede Ürün Bekleniyor...</h3>
        <p id="mus_tanitim" style="font-size:14px; color:#cbd5e1;"></p>
        
        <div class="foto-galeri" id="mus_fotolar"></div>

        <p><b>Güncel Pey / Fiyat:</b> <span id="mus_pey" class="fiyat">0 TL</span></p>
        <p><b>Önde Giden:</b> <span id="mus_kazanan" style="color:#f59e0b; font-weight:bold;">Yok</span></p>
        <p><b>Durum:</b> <span id="mus_durum">Bekliyor</span></p>
        
        <div style="background:#020617; padding:10px; border-radius:6px; margin-top:10px;">
            <div id="mus_sayac" class="sayac">--</div>
        </div>
    </div>

    <div class="kutu">
        <h3 style="margin-top:0; color:#38bdf8; font-size:15px;">💬 Teklif Ver (Pey Bırak)</h3>
        <label>Adınız Soyadınız:</label>
        <input type="text" id="mus_isim" placeholder="Adınız Soyadınız">
        <label>Teklif Ettiğiniz Rakam (TL):</label>
        <input type="number" id="mus_teklif" placeholder="Örn: 350">
        <button onclick="teklifVer()">🚀 Teklifimi Gönder</button>
    </div>
</div>

<script>
let oncekiSaniye = null;

function bipCal() {
    let ses = document.getElementById('alarmSesi');
    if(ses) {
        ses.currentTime = 0;
        ses.play().catch(err => console.log("Ses engeli:", err));
    }
}

function sesliSoyle(metin) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        let konusma = new SpeechSynthesisUtterance(metin);
        konusma.lang = 'tr-TR';
        konusma.rate = 1.1;
        window.speechSynthesis.speak(konusma);
    }
}

function veriCekMusteri() {
    fetch('/durum-getir')
    .then(res => res.json())
    .then(data => {
        let aktif = data.aktif_urun;
        if(aktif) {
            document.getElementById('mus_urun_ad').innerText = "#" + aktif.lot + " - " + aktif.ad;
            document.getElementById('mus_tanitim').innerText = aktif.tanitim;
            
            let fotoHTML = "";
            if(aktif.fotograflar && aktif.fotograflar.length > 0) {
                aktif.fotograflar.forEach(f => {
                    fotoHTML += `<img src="${f}" alt="Ürün Foto">`;
                });
            }
            document.getElementById('mus_fotolar').innerHTML = fotoHTML;
        } else {
            document.getElementById('mus_urun_ad').innerText = "Sahnede aktif ürün bekleniyor...";
            document.getElementById('mus_tanitim').innerText = "";
            document.getElementById('mus_fotolar').innerHTML = "";
        }

        document.getElementById('mus_pey').innerText = data.pey + " TL";
        document.getElementById('mus_kazanan').innerText = data.kazanan;
        document.getElementById('mus_durum').innerText = data.durum;

        if(data.durum === "Sayim") {
            let kalan = Math.max(0, Math.ceil(data.sure_bitis - (Date.now() / 1000)));
            document.getElementById('mus_sayac').innerText = kalan + " saniye";

            if (kalan !== oncekiSaniye && kalan > 0) {
                if (kalan <= 10) {
                    sesliSoyle(kalan.toString());
                } else {
                    bipCal();
                }
                oncekiSaniye = kalan;
            }
        } else {
            document.getElementById('mus_sayac').innerText = "Süre Bekleniyor";
            oncekiSaniye = null;
        }
    });
}

function teklifVer() {
    let isim = document.getElementById('mus_isim').value;
    let teklif = document.getElementById('mus_teklif').value;

    if(!isim || !teklif) {
        alert("Lütfen adınızı ve teklifinizi yazın!");
        return;
    }

    fetch('/musteri-teklif', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ musteri: isim, fiyat: teklif })
    })
    .then(res => res.json())
    .then(cevap => {
        alert(cevap.mesaj);
        document.getElementById('mus_teklif').value = "";
    });
}

setInterval(veriCekMusteri, 1000);
veriCekMusteri();
</script>
</body>
</html>
